# GLAS IN JENA: runs the web app's unit tests on design branches.
# Own workflow instead of changing coverage.yml: its turbo run aborts in @plentymarkets/shop-cli
# (missing @vitest/coverage-v8) before the web tests start.
name: glas-jena tests
on:
  push:
    branches:
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (web)
        working-directory: apps/web
        run: npx vitest run
