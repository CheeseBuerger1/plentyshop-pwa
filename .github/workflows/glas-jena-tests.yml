# GLAS IN JENA: runs the web app's unit tests on design branches, on every pull request to main and on every push
# to main – including GitHub's "Sync fork", which merges plentyshop-pwa updates into main without a pull request.
# The upstream contract test (modules/glas-jena/runtime/__tests__) then shows which customisation an update breaks.
# `web-unit-tests` is a required check for main, so it must run for PRs from any branch name.
# Own workflow instead of changing coverage.yml: its turbo run aborts in @plentymarkets/shop-cli
# (missing @vitest/coverage-v8) before the web tests start.
name: glas-jena tests
on:
  push:
    branches:
      - main
      - 'design/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (web)
        working-directory: apps/web
        run: npx vitest run
